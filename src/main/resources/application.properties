spring.application.name=territorio-de-ninos

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/territorioNinos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:very_secret_key_very_secret_key_very_secret_key_very_secret_key_very_secret_key_very_secret_key_very_secret_key}
jwt.expiration.hours=${JWT_EXPIRATION_HOURS:24}

# Frontend URL (for password reset email links)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application Info
server.port=8080
server.servlet.context-path=/territorioninos

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
server.port=8080
